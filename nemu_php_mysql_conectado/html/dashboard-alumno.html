<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Dashboard Alumno | Nemu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
          href="../css/styles.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-info"
               href="../index.html">
                Nemu
            </a>
            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse"
                 id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link"
                           href="../index.html">
                            Inicio
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link"
                           href="acerca.html">
                            Acerca de
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link"
                           href="ayuda.html">
                            Ayuda
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link"
                           href="registro.html">
                            Registro
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link"
                           href="login.html">
                            Login
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <section class="main-card p-4">

            <div class="d-flex justify-content-between
                        flex-wrap
                        gap-3
                        align-items-center
                        mb-4">
                <div>
                    <h1 id="dashboardAlumno">
                        Dashboard Alumno
                    </h1>
                    <p class="text-muted-custom mb-0">
                        Panel de consulta para el alumno.
                    </p>
                </div>
                <button class="btn btn-danger"
                        onclick="cerrarSesion()">
                    Cerrar sesión
                </button>
            </div>

            <h3>
                Cursos disponibles
            </h3>
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Curso</th>
                            <th>Descripción</th>
                            <th>Maestro</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCursosAlumno"></tbody>
                </table>
            </div>

            <h3 class="mt-4">
                Mis inscripciones
            </h3>
            <div class="placeholder-box">
                Espacio preparado para consultas del alumno.
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            Sistema Nemu | Sistema Escolar 
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/dashboard.js"></script>
    <script src="../js/sesion.js"></script>
</body>
</html>
