<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Login | Nemu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
          href="../css/styles.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-info" href="../index.html">
                Nemu
            </a>
            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse"
                 id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">
                            Inicio
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="acerca.html">
                            Acerca de
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="ayuda.html">
                            Ayuda
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="registro.html">
                            Registro
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active text-info" href="login.html">
                            Login
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <section class="main-card p-4">
                    <h1 class="mb-4">
                        Iniciar sesión
                    </h1>
                    <form id="loginForm">

                        <div class="mb-3">
                            <label class="form-label">
                                Correo electrónico
                            </label>
                            <input id="email" name="email" type="email" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Contraseña
                            </label>
                            <input id="password" name="password" type="password" class="form-control" required >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Rol
                            </label>
                            <select id="rol" name="rol" class="form-select" required>
                                <option value="alumno">
                                    Alumno
                                </option>
                                <option value="maestro">
                                    Maestro
                                </option>
                            </select>
                        </div>
                        <button class="btn btn-info w-100"
                                type="submit">
                            Entrar
                        </button>
                    </form>
                </section>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            Sistema Nemu | Sistema Escolar 
        </div>

    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/login.js"></script>
    </body>
</html>
